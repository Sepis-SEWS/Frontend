[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
font = "sans-serif"
borderColor = "#DCE3ED"
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EFF6FF"

[browser]
gatherUsageStats = false

[server]
headless = true

[client]
toolbarMode = "minimal"
